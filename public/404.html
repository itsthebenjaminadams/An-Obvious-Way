<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | An Obvious Way</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <main class="wrap">
    <div class="eyebrow">AOW / recovery console</div>
    <h1>Page not found<span class="accent" aria-hidden="true">_</span></h1>
    <p class="lead">This link leads to a dead end. It may be out of date, or the address may have a typo.</p>
    <div class="window">
      <div class="window-head"><span class="lights" aria-hidden="true"><i></i><i></i><i></i></span>route / 404</div>
      <div class="window-body">
        <h2>Pick a working route</h2>
        <nav aria-label="Recovery links" class="actions">
          <a class="btn primary" href="/">Home</a>
          <a class="btn secondary" href="/services/">Services</a>
          <a class="btn secondary" href="/portfolio/">Portfolio</a>
          <a class="btn secondary" href="/about/">About</a>
          <a class="btn secondary" href="/contact/">Contact</a>
        </nav>
      </div>
    </div>
  </main>
</body>
</html>
